<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>JADEVEIL — A Voxel Realm of Mist and Jade</title>
    <meta name="description" content="A Minecraft-styled single-player RPG in the browser: a Chinese voxel capital of mist and jade, JJ in a red hood and a rideable Ender Dragon. Installable, plays offline." />
    <meta name="application-name" content="JADEVEIL" />
    <meta name="theme-color" content="#0b1014" />
    <meta name="color-scheme" content="dark" />

    <!-- 图标：全部由 scripts/brand.mjs 从同一份像素 logo 生成 -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- 安装到 iOS / iPadOS 主屏幕后以全屏应用运行 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JADEVEIL" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- 分享卡（Open Graph / Twitter） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JADEVEIL" />
    <meta property="og:title" content="JADEVEIL — A Voxel Realm of Mist and Jade" />
    <meta property="og:description" content="A Minecraft-styled single-player RPG: a Chinese voxel capital, JJ in a red hood and a rideable Ender Dragon." />
    <meta property="og:url" content="https://jadeveil.xiaoa.name/" />
    <meta property="og:image" content="https://jadeveil.xiaoa.name/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JADEVEIL — a pixel pagoda under a jade moon beside the pixel wordmark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://jadeveil.xiaoa.name/og-image.png" />
    <link rel="canonical" href="https://jadeveil.xiaoa.name/" />
    <style>
      :root {
        --gold: #e8b44a;
        --gold-lit: #ffe08a;
        --gold-deep: #a8731f;
        --crimson: #c0392b;
        --crimson-deep: #8e2a20;
        --jade: #4a9e8f;
        --jade-lit: #6fc0ae;
        --ink: #0a0e12;
        --ink-1: #14181c;
        --bone: #f2e6cf;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05070a; }
      body {
        color: var(--bone);
        font-family: "Zpix", "Fusion Pixel", monospace;
        -webkit-font-smoothing: none;
      }
      canvas { display: block; }
      .px { image-rendering: pixelated; }

      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

      /* Panels get their pixel frame from pixelui.js */
      .panel { position: absolute; }

      /* ---------- Crosshair ---------- */
      #crosshair {
        position: absolute; left: 50%; top: 50%; width: 22px; height: 22px;
        transform: translate(-50%, -50%); opacity: 0.9; transition: opacity 0.18s;
      }
      #crosshair.hidden { opacity: 0; }
      #crosshair i { position: absolute; background: #fdf6e3; }
      #crosshair i:nth-child(1) { left: 50%; top: 0; width: 2px; height: 7px; margin-left: -1px; }
      #crosshair i:nth-child(2) { left: 50%; bottom: 0; width: 2px; height: 7px; margin-left: -1px; }
      #crosshair i:nth-child(3) { top: 50%; left: 0; height: 2px; width: 7px; margin-top: -1px; }
      #crosshair i:nth-child(4) { top: 50%; right: 0; height: 2px; width: 7px; margin-top: -1px; }
      #crosshair i:nth-child(5) {
        left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
        background: var(--gold);
      }

      /* ---------- Stats ---------- */
      /* 调试信息（F3）：统计与时间面板默认隐藏 */
      #stats { left: 14px; top: 14px; min-width: 176px; display: none; }
      body.debug #stats { display: block; }
      #stats .row { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 5px; }

      /* ---------- Time panel ---------- */
      #timepanel { left: 14px; top: 150px; min-width: 216px; pointer-events: auto; display: none; }
      body.debug #timepanel { display: block; }
      #timepanel .clock { margin: 6px 0 8px; display: flex; justify-content: flex-end; }
      #timeslider { width: 100%; margin-top: 4px; }
      .btnrow { display: flex; gap: 4px; margin-top: 7px; }
      .btnrow button { flex: 1; cursor: pointer; }

      /* ---------- Settings ---------- */
      #settings { right: 14px; top: 214px; width: 224px; pointer-events: auto; display: none; z-index: 30; }
      #settings.open { display: block; }
      #settings .field { margin-bottom: 11px; }
      #settings .field > .lbl { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
      #settings .tiers { display: flex; gap: 4px; }
      #settings .tiers button { flex: 1; cursor: pointer; }
      #settings input[type=range] { width: 100%; cursor: pointer; }
      #settings .toggle { display: flex; align-items: center; justify-content: space-between; margin-top: 7px; cursor: pointer; }
      #settings .toggle .sw { width: 34px; height: 16px; position: relative; }
      #settings .toggle .sw::after { content: ""; position: absolute; transition: none; }

      /* ---------- Hotbar ---------- */
      #hotbar {
        position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
        display: flex; gap: 2px; padding: 6px;
      }
      .slot { position: relative; width: 48px; height: 48px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; transition: none; }
      .slot canvas.icon { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
      .slot .num { position: absolute; right: 3px; top: 2px; }
      #itemname { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); opacity: 0; transition: opacity 0.15s; }
      #itemname.show { opacity: 1; }

      /* ---------- Help ---------- */
      #help { display: none; }
      #help .k { display: flex; gap: 8px; align-items: center; margin-top: 6px; }

      /* ---------- Minimap ---------- */
      #minimap { right: 14px; top: 14px; width: 176px; height: 176px; }
      #minimap canvas#minimap-canvas { width: 100%; height: 100%; image-rendering: pixelated; }
      #minimap .cap { position: absolute; left: 12px; top: 10px; }

      /* ---------- Chunk progress ---------- */
      #chunkprog {
        position: absolute; left: 50%; top: 62%; transform: translateX(-50%);
        opacity: 0; transition: opacity 0.4s;
      }
      /* 区块构建进度属于调试信息：只在 F3 调试视图里显示 */
      body.debug #chunkprog.show { opacity: 1; }

      /* ---------- Overlay / Pause ---------- */
      #overlay {
        position: fixed; inset: 0; z-index: 30; display: flex;
        align-items: center; justify-content: center; cursor: pointer;
        /* 标题页背后是实时渲染的主城（环绕镜头），只压一层暗角 */
        background: radial-gradient(ellipse at center, rgba(5,7,10,0.25) 30%, rgba(5,7,10,0.85) 100%);
      }
      #overlay.hidden { display: none; }
      #overlay .card { text-align: center; max-width: 860px; }
      #overlay .keys { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
      #overlay .cta { margin-top: 22px; }
      #overlay .credit { margin-top: 14px; }

      #pause {
        position: fixed; inset: 0; z-index: 25; display: none;
        align-items: center; justify-content: center; background: rgba(5, 7, 10, 0.92);
      }
      #pause.open { display: flex; }
      #pause .card { text-align: center; }
      #pause .keys { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
      #pause .cta { margin-top: 20px; }

      /* ---------- 虚空重生淡入淡出 ---------- */
      #voidfade {
        position: fixed; inset: 0; z-index: 55; pointer-events: none;
        background: #05070a; opacity: 0; transition: opacity 0.35s ease;
        display: flex; align-items: center; justify-content: center;
      }
      #voidfade.on { opacity: 1; }
      #voidfade .msg { transform: translateY(-40px); }

      /* ---------- Loading ---------- */
      #loading {
        position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px; background: #05070a;
        transition: opacity 0.5s ease, visibility 0.5s;
      }
      #loading.hidden { opacity: 0; visibility: hidden; }
      #loading .load-logo { image-rendering: pixelated; margin-bottom: -6px; }
      #loading .bar { width: 320px; height: 18px; display: flex; align-items: stretch; padding: 3px; }
      #loading .bar i { display: block; height: 100%; width: 0%; transition: width 0.3s; }
    </style>
  </head>
  <body>
    <div id="voidfade"><div class="msg" id="voidmsg"></div></div>

    <div id="loading">
      <img class="load-logo" src="/favicon.svg" width="96" height="96" alt="" />
      <div class="glyph" id="load-glyph"></div>
      <div class="bar"><i id="loadbar"></i></div>
      <div class="msg" id="loadmsg"></div>
    </div>

    <div id="hud">
      <div id="crosshair"><i></i><i></i><i></i><i></i><i></i></div>

      <div id="stats" class="panel">
        <div class="title" id="t-brand"></div>
        <div class="row"><span class="k" id="k-fps"></span><span class="v" id="s-fps"></span></div>
        <div class="row"><span class="k" id="k-pos"></span><span class="v" id="s-pos"></span></div>
        <div class="row"><span class="k" id="k-view"></span><span class="v" id="s-mode"></span></div>
        <div class="row"><span class="k" id="k-chunk"></span><span class="v" id="s-chunk"></span></div>
      </div>

      <div id="timepanel" class="panel">
        <div class="title" id="t-time"></div>
        <div class="clock" id="t-clock"></div>
        <input id="timeslider" type="range" min="0" max="1439" value="420" step="1" />
        <div class="btnrow">
          <button data-time="300" id="b-dawn"></button>
          <button data-time="720" id="b-noon"></button>
          <button data-time="1080" id="b-dusk"></button>
          <button data-time="1320" id="b-night"></button>
        </div>
        <div class="btnrow">
          <button id="btn-cycle"></button>
          <button id="btn-speed"></button>
        </div>
      </div>

      <div id="settings" class="panel">
        <div class="title" id="t-settings"></div>
        <div class="field">
          <div class="lbl" id="l-quality"></div>
          <div class="tiers">
            <button data-q="low" id="q-low"></button>
            <button data-q="medium" id="q-medium"></button>
            <button data-q="high" id="q-high"></button>
            <button data-q="ultra" id="q-ultra"></button>
          </div>
        </div>
        <div class="field">
          <div class="lbl"><span id="l-sens"></span><span id="v-sens"></span></div>
          <input id="r-sens" type="range" min="0.3" max="3" step="0.1" value="1" />
        </div>
        <div class="field">
          <div class="lbl"><span id="l-fov"></span><span id="v-fov"></span></div>
          <input id="r-fov" type="range" min="55" max="100" step="1" value="72" />
        </div>
        <div class="toggle on" id="t-bob"><span id="l-bob"></span><span class="sw"></span></div>
        <div class="toggle on" id="t-shadow"><span id="l-shadow"></span><span class="sw"></span></div>
        <div class="toggle on" id="t-bloom"><span id="l-bloom"></span><span class="sw"></span></div>
        <div class="field">
          <div class="lbl"><span id="l-audio"></span></div>
        </div>
        <div class="field">
          <div class="lbl"><span id="l-musicvol"></span><span id="v-musicvol"></span></div>
          <input id="r-musicvol" type="range" min="0" max="1" step="0.05" value="0.8" />
        </div>
        <div class="toggle on" id="t-music"><span id="l-music"></span><span class="sw"></span></div>
        <div class="field">
          <div class="lbl"><span id="l-sfxvol"></span><span id="v-sfxvol"></span></div>
          <input id="r-sfxvol" type="range" min="0" max="1" step="0.05" value="1" />
        </div>
        <div class="toggle on" id="t-sfx"><span id="l-sfx"></span><span class="sw"></span></div>
      </div>

      <div id="itemname"></div>
      <div id="hotbar"></div>

      <div id="minimap" class="panel">
        <div class="cap" id="t-map"></div>
        <canvas id="minimap-canvas" width="156" height="156"></canvas>
      </div>

      <div id="help" class="panel">
        <div class="k"><span id="h-move-l"></span><span id="h-move-v"></span></div>
        <div class="k"><span id="h-view-l"></span><span id="h-view-v"></span></div>
        <div class="k"><span id="h-build-l"></span><span id="h-build-v"></span></div>
        <div class="k"><span id="h-world-l"></span><span id="h-world-v"></span></div>
        <div class="k"><span id="h-esc"></span></div>
      </div>

      <div id="chunkprog"></div>
    </div>

    <div id="pause">
      <div class="card panel" style="position: static;">
        <div id="p-title"></div>
        <div id="p-sub"></div>
        <div class="keys">
          <div id="p-k1"></div>
          <div id="p-k2"></div>
          <div id="p-k3"></div>
        </div>
        <div class="cta" id="p-cta"></div>
      </div>
    </div>

    <div id="overlay">
      <div class="card panel" style="position: static;">
        <div id="o-title"></div>
        <div id="o-sub"></div>
        <div class="keys">
          <div id="o-k1"></div>
          <div id="o-k2"></div>
          <div id="o-k3"></div>
        </div>
        <div class="cta" id="o-cta"></div>
        <div class="credit" id="o-credit"></div>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
